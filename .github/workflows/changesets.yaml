name: Changesets

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Create Release Pull Request or create a release
        id: changesets
        uses: changesets/action@v2
        with:
          # A personal access token is needed here: tags pushed with the default
          # GITHUB_TOKEN would not trigger the release workflow.
          github-token: ${{ secrets.GH_TOKEN }}
          publish-script: npm run release
          commit-message: "chore: release"
          pr-title: "Merge to release"
